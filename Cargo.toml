[package]
name = "rust-cargo-plugin"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "plugin"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0.219", features = ["derive"] }
extism-convert = "1.11.1"
toml = "0.8.23"
toml_edit = "0.22.27"

[dev-dependencies]
tempfile = "3.20.0"
similar = "2.6.0"
similar-asserts = "1.7.0"
rstest = "0.25.0"
